name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Prepare web assets for Capacitor
        run: |
          ls -la
          echo "---.output content ---"
          ls -la.output 2>&1 || echo "no.output"
          ls -la.output/public 2>&1 || echo "no.output/public"
          rm -rf dist
          mkdir -p dist
          if [ -d ".output/public" ]; then cp -r.output/public/* dist/; echo "copied.output/public to dist";
          elif [ -d "build" ]; then cp -r build/* dist/; echo "copied build to dist";
          elif [ -d "dist-static" ]; then cp -r dist-static/* dist/;
          elif [ -d ".output" ]; then cp -r.output/* dist/ 2>&1 || true;
          fi
          ls -la dist
          if [! -f "dist/index.html" ]; then echo '<html><body><h1>Hello World Helper</h1></body></html>' > dist/index.html; fi
      - run: rm -rf android
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - run: |
          cat > capacitor.config.ts << 'EOF'
          import { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = { appId: 'com.aadilkh.helloworld', appName: 'hello-world-helper', webDir: 'dist' };
          export default config;
          EOF
      - run: npx cap add android
      - run: npx cap copy android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
