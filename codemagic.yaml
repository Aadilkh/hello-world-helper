workflows:
  android-workflow:
    name: Android APK Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 20
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web
        script: |
          npm run build || true
          mkdir -p dist
          if [ -d ".output/public" ]; then cp -r .output/public/* dist/; fi
          if [ -d "dist/dist" ]; then mv dist/dist/* dist/; fi
          if [ ! -f "dist/index.html" ]; then echo "<html><body><h1>Hello World Helper</h1></body></html>" > dist/index.html; fi
      - name: Setup Android
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          printf "import { CapacitorConfig } from '@capacitor/cli';\nconst config: CapacitorConfig = { appId: 'com.aadilkh.helloworld', appName: 'hello-world-helper', webDir: 'dist' };\nexport default config;" > capacitor.config.ts
          npx cap add android
          npx cap copy android
      - name: Fix duplicate kotlin classes
        script: |
          cd android
          # Fix kotlin duplicate issue
          echo "Fixing gradle..."
          printf "\nconfigurations.all {\n  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n}\n" >> app/build.gradle
          cat app/build.gradle
      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
